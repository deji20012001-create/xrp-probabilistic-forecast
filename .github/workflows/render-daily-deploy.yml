name: Daily Render deploy

on:
  schedule:
    # 02:30 fixed EST (UTC-5). During daylight time this runs at 03:30 EDT.
    - cron: "30 7 * * *"
  workflow_dispatch:

concurrency:
  group: render-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify deploy hook is configured
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "Repository secret RENDER_DEPLOY_HOOK_URL is required."
            exit 1
          fi

      - name: Trigger production deployment
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          curl --fail-with-body --silent --show-error \
            --retry 3 --retry-all-errors --max-time 60 \
            --request POST "$RENDER_DEPLOY_HOOK_URL"

