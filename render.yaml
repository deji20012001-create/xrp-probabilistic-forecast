services:
  - type: web
    name: xrp-forecast
    runtime: docker
    plan: starter
    healthCheckPath: /health
    autoDeployTrigger: checksPass
    dockerfilePath: ./Dockerfile
    envVars:
      - key: APP_ENV
        value: production
      - key: PROVIDER
        value: coinbase
      - key: SYMBOL
        value: XRP/USD
      - key: MODEL_FAMILY
        value: baseline
      - key: DATABASE_URL
        fromDatabase:
          name: xrp-forecast-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: xrp-forecast-cache
          type: keyvalue
          property: connectionString
      - key: ADMIN_API_KEY
        generateValue: true

  - type: keyvalue
    name: xrp-forecast-cache
    plan: starter
    # Keep Redis private; the web service connects over Render's internal network.
    ipAllowList: []

databases:
  - name: xrp-forecast-db
    plan: starter
    databaseName: xrp_forecast
    user: xrp_forecast

